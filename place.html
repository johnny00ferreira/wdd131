<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brazil</title>
    <meta name="author" content="Johnny Ferreira da Silva">
    <meta name="description" content="Discover Brazil through stunning landscapes, iconic landmarks, and vibrant culture, showcasing beaches, cities, and unforgettable views perfect for travelers.">
    <link rel="stylesheet" href="styles/place.css">
    <link rel="stylesheet" href="styles/place-large.css">

    <script src="scripts/place.js" defer></script>
</head>

<body>

    <header>
        <h1>Brazil</h1>
    </header>
    <nav>
        <a href="place.html">Home</a>
        <a href="temples.html">Temples</a>
    </nav>


    <main>
        <picture class="hero">
            <source srcset="images/brazil-large.webp" media="(min-width: 900px)">
            <source srcset="images/brazil-medium.webp" media="(min-width: 500px)">
            <img src="images/brazil-small.webp" alt="Landscape of Brazil">
        </picture>

        <section class="data">
            <h2>Data</h2>
            <p><strong>Capital:</strong> Brasília</p>
            <p><strong>Population:</strong> <span id="population"></span></p>
            <p><strong>Language:</strong> Portuguese</p>
            <p><strong>Currency:</strong> Brazilian Real (BRL)</p>
            <p><strong>Region:</strong> South America</p>
        </section>

        <section class="weather">
            <h2>Weather ⛅</h2>
            <img src="images/weather.svg" alt="Weather icon" class="weather-icon">
            <p><strong>Temperature:</strong> <span id="temperature"></span>°C</p>
            <p><strong>Condition:</strong> Sunny</p>
            <p><strong>Wind Speed:</strong> <span id="wind"></span> km/h</p>
            <p><strong>Wind Chill:</strong> <span id="windchill"></span></p>
        </section>
    </main>

    <footer>
        <p>© <span id="year"></span> | Brazil | Johnny Ferreira da Silva</p>
        <p>Last Modified: <span id="modified"></span></p>
    </footer>

</body>

</html>
